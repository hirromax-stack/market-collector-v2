<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planification - Market Collector</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: #2563eb; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn { background: #2563eb; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #1d4ed8; }
        .back-btn { background: #6b7280; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏰ Planification des emails</h1>
        
        <form method="POST">
            <div class="form-group">
                <label>
                    <input type="checkbox" name="email_enabled" {% if config.email_enabled %}checked{% endif %}>
                    Activer l'envoi automatique des emails
                </label>
            </div>
            
            <div class="form-group">
                <label>Heure d'envoi quotidien (UTC)</label>
                <input type="time" name="schedule_time" value="{{ config.email_schedule }}" required>
            </div>
            
            <div class="form-group">
                <label>Fuseau horaire</label>
                <select name="timezone">
                    <option value="UTC" {% if config.timezone == 'UTC' %}selected{% endif %}>UTC</option>
                    <option value="Europe/Paris" {% if config.timezone == 'Europe/Paris' %}selected{% endif %}>Europe/Paris</option>
                    <option value="America/New_York" {% if config.timezone == 'America/New_York' %}selected{% endif %}>New York</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Destinataires (séparés par des virgules)</label>
                <textarea name="recipients" rows="4" placeholder="email1@example.com, email2@example.com">
{{ config.email_recipients|join(', ') }}</textarea>
            </div>
            
            <div>
                <a href="/admin" class="btn back-btn">← Retour</a>
                <button type="submit" class="btn">Enregistrer</button>
            </div>
        </form>
    </div>
</body>
</html>
